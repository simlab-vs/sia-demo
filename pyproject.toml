[project]
name = "ifc-fem-demo"
version = "0.1.0"
description = "Teaching demo: IFC-based BIM modelling with ifcopenshell, a PyNite shell-and-frame check, VTK renders and a seismic scenario against SIA 261"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ifcopenshell>=0.8.5",
    "imageio[ffmpeg]>=2.37.4",
    "matplotlib>=3.10",
    "pynitefea>=3.2.0",
    "pyvista>=0.49.0",
]

[project.scripts]
ifc-fem-demo = "ifc_fem_demo.pipeline:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
