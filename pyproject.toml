[project]
name = "points-to-bim"
version = "0.1.0"
description = "Laser-scan point clouds of Pont de la Praz to an IFC 4.3 bridge model"
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell>=0.8.5",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pye57>=0.4.19",
    "pyvista>=0.49.0",
    "rasterio>=1.5.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
